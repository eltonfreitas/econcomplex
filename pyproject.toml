[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econcomplex"
version = "1.0.0"
description = "Python library for economic complexity and regional science indicators"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Elton Freitas" }
]
keywords = [
  "economic complexity",
  "regional science",
  "economic geography",
  "product space",
  "relatedness"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.9"
]

[project.urls]
Homepage = "https://github.com/eltonfreitas/econcomplex"
Documentation = "https://github.com/eltonfreitas/econcomplex/tree/main/docs"
Changelog = "https://github.com/eltonfreitas/econcomplex/blob/main/CHANGELOG.md"
Issues = "https://github.com/eltonfreitas/econcomplex/issues"

[project.optional-dependencies]
dev = [
  "black",
  "build",
  "isort",
  "pytest",
  "pytest-cov",
  "twine"
]
network = [
  "networkx>=2.6"
]

[tool.setuptools.packages.find]
include = ["econcomplex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
